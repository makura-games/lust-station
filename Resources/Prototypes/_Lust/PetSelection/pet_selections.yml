- type: entity
  name: Мякошка
  id: MobMyakoshaEpsilon
  parent: MobMyakosha [SimpleMobBase, BasePet]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Sunrise/Mobs/Pets/Myakosha.rsi
    layers:
    - state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: PointLight
    radius: 1.8
    energy: 1.2
  - type: Grammar
    attributes:
      gender: female
- type: entity
  name: Мякошка
  id: BoxPetMyakosha
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: pet_carrier
  - type: SpawnItemsOnUse
    items:
    - id: MobMyakosha
    sound:
      path: /Audio/Animals/_Last/Pumpkins.mp3
  - type: Item
    size: Small
  - type: HeldSpeedModifier


