- type: reagent
  id: Stonium
  name: reagent-name-stonium
  group: Special
  desc: reagent-desc-stonium
  physicalDesc: reagent-physical-desc-stonium
  flavor: funny
  color: "#db4dff"
  metabolisms:
    Bloodstream:
      effects:
      - !type:Emote
        emote: Moan
        probability: 0.4
        showInChat: true
      - !type:PopupMessage
        type: Local
        messages: [ "stonium-effect1", "stonium-effect2" ]
        probability: 0.1

- type: reagent
  id: Aphrodisiac
  name: reagent-name-aphrodisiac
  group: Special
  desc: reagent-desc-aphrodisiac
  physicalDesc: reagent-physical-desc-aphrodisiac
  flavor: funny
  color: "#FF00E8"
  metabolisms:
    Bloodstream:
      effects:
      - !type:PopupMessage
        type: Local
        messages: [ "aphrodisiac-effect1", "aphrodisiac-effect2" ]
        probability: 0.1
      - !type:GenericStatusEffect
        key: LoveEffect
        component: LoveVision
        time: 10.0  # Полная баночка = 5 минут
        type: Add
      - !type:Jitter
        refresh: false
        time: 1.0  # Полная баночка = 1 минута тряски
        amplitude: 2
        frequency: 5

- type: reagent
  id: LustJuiceThatMakesYouMeow
  name: reagent-name-meow
  group: Toxins
  desc: reagent-desc-meow
  physicalDesc: reagent-physical-desc-vibrant
  flavor: magical
  color: "#e89dc5"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:Emote
        emote: Mew
        showInChat: true
        showInGuidebook: true
        force: true
        probability: 0.5
      - !type:Polymorph
        prototype: LustArtifactCat
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal ]
          inverted: true
        - !type:ReagentCondition
          reagent: LustJuiceThatMakesYouMeow
          min: 50
      - !type:AdjustReagent
        reagent: LustJuiceThatMakesYouMeow
        amount: -20
        conditions:
        - !type:ReagentCondition
          reagent: LustJuiceThatMakesYouMeow
          min: 50
