- type: entity
  name: Мякошка
  id: MobMyakoshaAliceCustom
  parent: Myakosha [SimpleMobBase, BasePet]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Sunrise/Mobs/Pets/Myakosha.rsi
    layers:
    - state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: GhostRole
    name: ghost-role-information-alice-custom-name
    description: ghost-role-information-alice-custom-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: default
  - type: Grammar
    attributes:
      gender: female
  - type: HTN
    rootTask:
      task: PetCompound
  - type: SpawnItemsOnUse
    items:
    - id: MobMyakosha
    sound:
      path: /Audio/Animals/_Last/Pumpkins.mp3

