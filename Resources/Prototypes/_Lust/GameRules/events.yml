- type: entity
  parent: BaseGameRule
  id: ERTShuttleEpsilonArrows
  components:
  - type: StationEvent
    startAnnouncement: null
    startAudio: /Audio/Announcements/bloblarm.ogg
    duration: -0
    endAudio: /Audio/Announcements/bloblarm.ogg
  - type: LoadMapRule
    preloadedGrid: MTShuttle
  - type: RuleGrids

- type: entity
  id: RadiationOutburst
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-radiation-outburst-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 4
    minimumPlayers: 25
    duration: 1
  - type: RadiationOutburstRule

- type: entity
  id: RadiationStorm
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-radiation-storm-start-announcement
    endAnnouncement: station-event-radiation-storm-end-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 20
    weight: 5
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: RadiationTemporary
      prob: 1.0

- type: entity
  id: HoloCarpSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-holopad-malfunction-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 30
    minimumPlayers: 20
    weight: 4
    duration: 20
  - type: HolopadCrittersRule
    spawnFromAllHolopads: true
    entries:
    - id: MobCarpHolo
      prob: 0.998
    specialEntries:
    - id: MobDragonDungeon
      prob: 0.002  # кек
