- type: entity
  parent: BaseGameRule
  id: ERTShuttleEpsilonArrows
  components:
  - type: StationEvent
    startAnnouncement: null
    startAudio: /Audio/Announcements/bloblarm.ogg
    duration: -0
    endAudio: /Audio/Announcements/bloblarm.ogg
  - type: LoadMapRule
    preloadedGrid: MTShuttle
  - type: RuleGrids

- type: entity
  id: VendingmachineMalfunction
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vending-malfunction-announcement
    startAudio:
      path: /Audio/_Sunrise/Announcements/announce_dig.ogg
    earliestStart: 15
    minimumPlayers: 10
    weight: 5
    duration: 1
  - type: VendingMachineMalfRule
    minMachines: 3
    maxMachines: 30
    minItems: 1
    maxItems: 7

- type: entity
  id: CrewMonitoringMalf
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 1
    weight: 4
    duration: 60
    maxDuration: 180
    reoccurrenceDelay: 1
    maxOccurrences: 1
    occursDuringRoundEnd: false
  - type: CrewMonitoringMalfRule
    minPlayerFraction: 0.1
    maxPlayerFraction: 0.3
    criticalChance: 25
    deadChance: 10
    poorChance: 50
  - type: GameRule
    delay:
      min: 0
      max: 0

- type: entity
  id: RadioChannelShuffle
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-radio-channel-shuffle-start
    endAnnouncement: station-event-radio-channel-shuffle-end
    startAudio:
      path: /Audio/_Sunrise/Announcements/announce_dig.ogg
    endAudio:
      path: /Audio/_Sunrise/Announcements/announce_dig.ogg
    earliestStart: 15
    minimumPlayers: 1
    weight: 4
    duration: 60
    maxDuration: 180
    reoccurrenceDelay: 30
    maxOccurrences: 2
    occursDuringRoundEnd: false
  - type: RadioChannelShuffleRule
    redirectChance: 0.3
    channels:
    - Common
    - Command
    - Engineering
    - Medical
    - Security
    - Science
    - Service
    - Supply
  - type: GameRule
    delay:
      min: 0
      max: 0
      
- type: entity    
  id: LustRadiationOutburst
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-radiation-outburst-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 4
    minimumPlayers: 25
    duration: 1
  - type: RadiationOutburstRule

- type: entity
  id: LustRadiationStorm
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-radiation-storm-start-announcement
    endAnnouncement: station-event-radiation-storm-end-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 20
    weight: 5
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: RadiationTemporary
      prob: 1.0

- type: entity
  id: LustHoloCarpSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-holopad-malfunction-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 30
    minimumPlayers: 20
    weight: 4
    duration: 20
  - type: HolopadCrittersRule
    spawnFromAllHolopads: true
    entries:
    - id: MobCarpHolo
      prob: 0.998
    specialEntries:
    - id: MobDragonDungeon
      prob: 0.002  # кек
