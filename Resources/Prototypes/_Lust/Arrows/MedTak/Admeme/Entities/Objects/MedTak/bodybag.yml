- type: entity
  id: LustBodyBagMedTak
  parent: [ BodyBag, LustBaseMedTakContraband ]
  name: secure body bag
  components:
  - type: Sprite
    sprite: _Lust/Admeme/Objects/MedTak/bodybag.rsi
  - type: Icon
    sprite: _Lust/Admeme/Objects/MedTak/bodybag.rsi
    state: bag
  - type: AccessReader
    access: [["LustMedTak"]]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: LustBodyBagMedTakFolded
  parent: LustBodyBagMedTak
  suffix: folded
  components:
  - type: Foldable
    folded: true
