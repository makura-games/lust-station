# Restricted treatment-room storage and billing form.
- type: entity
  id: LustShelfMedTak
  parent: ShelfChemistry
  name: MedTak supplies shelf
  description: A sturdy and compact shelf for holding medical supplies.
  components:
  - type: Sprite
    sprite: _Lust/Structures/Storage/Shelfs/medtak.rsi

- type: entity
  id: LustShelfMedTakSecure
  parent: LustShelfMedTak
  suffix: Secure
  components:
  - type: AccessReader
    access: [[LustMedTak]]

- type: entity
  id: LustWindoorSecureMedTakLocked
  parent: WindoorSecure
  suffix: MedTak, Locked
  components:
  - type: ContainerFill
    containers:
      board: [LustDoorElectronicsMedTak]
  - type: Wires
    layoutId: LustAirlockMedTak

- type: entity
  id: LustPaperMedTak
  parent: Paper
  name: MedTak invoice
  description: A piece of paper headed by the MedTak logo. It looks expensive. For you.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#ffffff"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#ffffff"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: CaptainsPaper
  - type: PaperVisuals
    headerImagePath: "/Textures/_Lust/Interface/Paper/MedTak.png"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 8.0, 16.0, 8.0, 0.0
    maxWritableArea: 350.0, 0.0
