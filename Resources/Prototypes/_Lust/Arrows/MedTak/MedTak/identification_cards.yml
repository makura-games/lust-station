# MedTak ID cards
- type: entity
  parent: IDCardStandard
  id: LustMedTakTeamLeadIDCard
  name: MedTak team leader ID card
  components:
  - type: Sprite
    sprite: _Lust/Objects/Misc/id_cards.rsi
    layers:
    - state: medtak
    - sprite: &medtak-icon-rsi _Lust/Interface/Misc/job_icons.rsi
      offset: &medtak-icon-offset -0.09375, 0.0625
      state: MedTakLeader
  - type: IdCard
    jobTitle: job-name-medtak-leader
    jobIcon: LustJobIconMedTakLeader
  - type: Access
    tags: [ LustMedTak, MTO, MTOL ]

