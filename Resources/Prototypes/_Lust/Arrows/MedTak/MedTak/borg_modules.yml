# region MedTak
- type: entity
  id: LustBaseBorgModuleMedTak
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Sprite
    sprite: _Lust/Objects/Specific/Robotics/borgmodule.rsi
  - type: BorgModule
    borgFitTypes:
    - borg-type-medtak
  - type: Tag
    tags:
    - LustBorgModuleMedTak
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#ffffff"
      - state: base-module-inhand-left
        color: "#660505"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#ffffff"
      right:
      - state: base-icon-inhand-right
        color: "#ffffff"
      - state: base-module-inhand-right
        color: "#660505"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#ffffff"

- type: entity
  id: LustBorgModuleMedTakMedical
  parent: [ LustBaseBorgModuleMedTak, BaseProviderBorgModule ]
  name: MedTak medical cyborg module
  description: A MedTak cyborg module for medical support.
  components:
  - type: Sprite
    layers:
    - state: medtak
    - state: icon-medtak-med
  - type: ItemBorgModule
    hands:
    - item: HandheldHealthAnalyzer
    - item: MedipenCombatInjector
      hand:
        emptyLabel: borg-slot-syringe-empty
        emptyRepresentative: MedipenCombatInjector
        whitelist:
          tags:
          - Syringe
    - hand:
        emptyLabel: borg-slot-topicals-empty
        emptyRepresentative: MedicatedSuture
        whitelist:
          components:
          - Healing
          - FitsInDispenser
          tags:
          - ChemDispensable
          - Bottle
    - item: LustMedTakHoverBedSpawnFolded
      hand:
        emptyLabel: borg-slot-rollerbeds-empty
        emptyRepresentative: LustMedTakHoverBed
        whitelist:
          tags:
          - BodyBag
          - RollerBed
    - item: LustMedkitCombatMedTakFilledBorg
    - item: LustBottleCaseMedTakFilled
  - type: BorgModuleIcon
    icon: { sprite: _Lust/Interface/Actions/actions_borg.rsi, state: medtak-aid-module }

