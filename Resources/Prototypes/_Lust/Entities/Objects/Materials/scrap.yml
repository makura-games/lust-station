- type: entity
  parent: BaseScrap
  id: LustBaseScrap
  abstract: true
  name: scrap
  description: Worthless junk. You could probably get some materials out of it though.
  suffix: Scrap
  components:
  - type: Sprite
    sprite: _Lust/Objects/Materials/garbage.rsi
  - type: Item
    sprite: _Lust/Objects/Materials/garbage.rsi
    size: Normal

- type: entity
  parent: LustBaseScrap
  id: ScrapNewspaper
  name: old newspaper
  description: Where did this come from on the space station?
  components:
  - type: Sprite
    sprite: _Lust/Objects/Materials/garbage.rsi
    layers:
    - map: ["base"]
      state: paper1
  - type: RandomSprite
    available:
    - base:
        paper: ""
        paper1: ""
        paper5: ""
  - type: PhysicalComposition
    materialComposition:
      Plastic: 500 # 5 sheets
      SalvageTicket: 5 # 5 tickets

