- type: entity
  id: LustBulletKineticLongRange
  name: kinetic bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 25
        Structural: 20
  # Short lifespan
  - type: TimedDespawn
    lifetime: 15 # roughly 6.5 tiles
  - type: GatheringProjectile
  # Sunrise-Start
  - type: StaminaDamageOnCollide
    damage: 10
  # Sunrise-End
