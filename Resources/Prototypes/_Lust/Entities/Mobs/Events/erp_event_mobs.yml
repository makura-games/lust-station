#Moth
- type: entity
  name: смертомоль
  id: LustERPEventMothNakedFolded
  parent: LustBaseSimpleEventMobMoth
  description: Если она села на стену – не дыши. Она ждет.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: moth_1_1
      sprite: /Uploaded/DoVaPoot/mob/texture/mobs/events/moth.rsi
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.SwitchableVisuals.Switched:
        enum.DamageStateVisualLayers.Base:
          folded: { state: moth_1_1 }
          unfolded: { state: moth_1_2 }
  - type: ItemSwitch
    state: folded
    onUse: false
    states:
      folded: !type:ItemSwitchState
        verb: Сложить крылья
      unfolded: !type:ItemSwitchState
        verb: Раскрыть крылья

