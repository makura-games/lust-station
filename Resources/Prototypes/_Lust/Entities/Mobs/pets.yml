- type: entity
  name: Shoebill
  parent: [SimpleMobBase, StripableInventoryBase]
  id: LustMobShoebill
  description: A large bird from hot places and your terrifying dreams.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lust/Mobs/Animals/shoebill.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
    - map: [ "head" ]
    - map: [ "eyes" ]
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Weapons/Guns/Gunshots/bang.ogg
    damage:
      types:
        Piercing: 12
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Critical:
        Base: s_dead
      Dead:
        Base: s_dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-dog
    interactFailureString: petting-failure-dog
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Weapons/Guns/Gunshots/hpistol.ogg
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
  - type: MessyDrinker
  - type: CanEscapeInventory
  - type: AttackOnInteractionFail
    attackMemoryLength: 10
  - type: NPCRetaliation
  - type: FactionException
  - type: StealTarget
    stealGroup: AnimalShoebill
  - type: Inventory
    templateId: pet

- type: entity
  id: LustPetBigRat
  parent: [SimpleMobBase, BasePet]
  name: big mouse
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: UserInterface
    interfaces:
      enum.PetControlUiKey.Key:
        type: PetControlBoundUserInterface
        interactionRange: -1
  - type: HTN
    rootTask:
      task: PetCompound
    blackboard:
      IdleRange: !type:Single
        2.0
      FollowCloseRange: !type:Single
        1.0
      FollowRange: !type:Single
        1.5
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
    allowedEmotes: ['Squeak']
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/rat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: rat
    scale: 1.25,1.25
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rat
      Critical:
        Base: dead
      Dead:
        Base: splat
  - type: Item
    size: Tiny
  - type: SpriteMovement
    movementLayers:
      movement:
        state: rat-moving
    noMovementLayers:
      movement:
        state: rat
  - type: Clothing
    quickEquip: false
    sprite: Mobs/Animals/mouse.rsi
    equippedPrefix: 0
    slots:
    - HEAD
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: Vocal
    sounds:
      Male: Mouse
      Female: Mouse
      Unsexed: Mouse
    wilhelmProbability: 0.001
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Piercing: 4
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 500
  - type: CanEscapeInventory
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: NightVision
