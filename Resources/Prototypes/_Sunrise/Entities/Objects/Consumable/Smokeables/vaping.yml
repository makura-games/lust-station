- type: entity
  parent: [BaseItem, SolutionSmokable, SolutionTiny]
  id: VapeCartridge
  name: vape cartridge
  description: A 15u refillable pod cartridge for electronic vaporizers. Can be refilled with any vape e-liquid.
  components:
  - type: VapeCartridge
  - type: Item
    size: Tiny
  - type: RefillableSolution
    solution: smokable
  - type: DrainableSolution
    solution: smokable
  - type: ExaminableSolution
    solution: smokable
  - type: SolutionTransfer
    maxTransferAmount: 15
    transferAmount: 5
    canChangeTransferAmount: true
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/Vapes/cartridge.rsi
    scale: "0.6, 0.6"
    layers:
    - state: cartridge-empty
      map: ["enum.VapeVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VapeVisuals.CartridgeFlavor:
        enum.VapeVisualLayers.Base:
          empty: { state: cartridge-empty }
          mint: { state: cartridge-mint }
          berry: { state: cartridge-berry }
          tobacco: { state: cartridge-tobacco }
          banana: { state: cartridge-banana }
  - type: Solution
    id: smokable
    solution:
      maxVol: 15

- type: entity
  parent: VapeCartridge
  id: VapeCartridgeMint
  name: mint vape cartridge
  suffix: Mint
  description: A pre-filled 15u pod cartridge filled with refreshing mint e-liquid.
  components:
  - type: Solution
    id: smokable
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Water
        Quantity: 9
      - ReagentId: Nicotine
        Quantity: 4
      - ReagentId: JuiceLime
        Quantity: 2

- type: entity
  parent: VapeCartridge
  id: VapeCartridgeBerry
  name: berry vape cartridge
  suffix: Berry
  description: A pre-filled 15u pod cartridge filled with sweet mixed berry e-liquid.
  components:
  - type: Solution
    id: smokable
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Water
        Quantity: 9
      - ReagentId: Nicotine
        Quantity: 4
      - ReagentId: JuiceBerry
        Quantity: 2

- type: entity
  parent: VapeCartridge
  id: VapeCartridgeTobacco
  name: tobacco vape cartridge
  suffix: Tobacco
  description: A pre-filled 15u pod cartridge filled with classic tobacco e-liquid.
  components:
  - type: Solution
    id: smokable
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Water
        Quantity: 9
      - ReagentId: Nicotine
        Quantity: 5
      - ReagentId: Coffee
        Quantity: 1

- type: entity
  parent: VapeCartridge
  id: VapeCartridgeBanana
  name: banana vape cartridge
  suffix: Banana
  description: A pre-filled 15u pod cartridge filled with sweet banana bubblegum e-liquid.
  components:
  - type: Solution
    id: smokable
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Water
        Quantity: 9
