- type: entity
  parent: BaseAnomalyCore
  id: AnomalyCoreSound
  suffix: Sound
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/Cores/electric_core.rsi
    color: "#66ccff"
  - type: PointLight
    radius: 1.5
    energy: 2.0
    color: "#4da6ff"
    castShadows: false
  - type: SoundAnomalyCore
    isInert: false

- type: entity
  parent: BaseAnomalyInertCore
  id: AnomalyCoreSoundInert
  suffix: Sound, Inert
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/Cores/electric_core.rsi
    color: "#66ccff"
  - type: SoundAnomalyCore
    isInert: true

# Alias для обратной совместимости
- type: entity
  parent: AnomalyCoreSound
  id: AnomalyCoreSonic
  categories: [ HideSpawnMenu ]

- type: entity
  parent: AnomalyCoreSoundInert
  id: AnomalyCoreSonicInert
  categories: [ HideSpawnMenu ]
