- type: gameMap
  id: SunriseCentComm
  mapName: 'Central Command'
  mapPath: /Maps/_Sunrise/Station/centcomm.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 1
  stations:
    centcomm:
      stationProto: NanotrasenCentralCommand
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Центральное командование {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationJobs
          availableJobs:
              #centcom
            CentCommOperator: [ 1, 2 ]
            BlueShieldOperative: [1, 2]
            # Lust-Start
            LustCentCommInspector: [ 1, 2 ]
            LustCentCommChiefOfStaff: [ 1, 1 ]
            LustCentCommIntern: [ 1, 2 ]
            LustCentCommIDOperator: [ 1, 2 ]
            LustCentCommSpecOpsOperator: [ 1, 1 ]
            LustCentCommMaid: [ 1, 1 ]
            # Lust-End
